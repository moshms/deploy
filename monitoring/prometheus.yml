global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mc-api
    static_configs:
      - targets: ["mc-api:8080"]

  - job_name: mc-worker
    static_configs:
      - targets: ["mc-worker:8081"]

  - job_name: mc-transcoder
    static_configs:
      - targets: ["mc-transcoder:8082"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
